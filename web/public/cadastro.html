<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/style.css?v=10">
    <link rel="icon" type="image/jpeg" href="assets/img/logo-autoflow.jpg">
    <title>Cadastro</title>
    <link rel="stylesheet" href="assets/css/identity.css?v=1">
</head>

<body class="login-page">

    <main class="login-container">
        <section class="login-box">

            <header class="login-header">
                <img class="login-logo" src="assets/img/logo-autoflow.jpg" alt="AutoFlow Mecânica">
                <h1 class="sr-only">AutoFlow Mecânica</h1>
                <p>Criar uma conta</p>
            </header>

            <form id="register-form">
                <div class="form-group">
                    <label for="nome">Nome completo</label>
                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="telefone">Telefone</label>
                    <input
                        type="tel"
                        id="telefone"
                        name="telefone"
                        autocomplete="tel"
                    >
                </div>

                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        data-target="senha"
                    >
                        Mostrar senha
                    </button>
                </div>

                <div class="form-group">
                    <label for="confirmar-senha">Confirmar senha</label>
                    <input
                        type="password"
                        id="confirmar-senha"
                        name="confirmar_senha"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        data-target="confirmar-senha"
                    >
                        Mostrar senha
                    </button>
                </div>

                <button type="submit">Criar conta</button>
                <p id="register-message" class="form-message" aria-live="polite"></p>
            </form>

            <p class="register-link">
                Já possui uma conta?
                <a href="index.html">Entrar</a>
            </p>

        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/integration.js?v=9"></script>
    <script src="assets/js/script.js?v=9"></script>
</body>
</html>
