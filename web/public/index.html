<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/style.css?v=10">
    <link rel="icon" type="image/jpeg" href="assets/img/logo-autoflow.jpg">
    <title>AutoFlow - Login</title>
    <link rel="stylesheet" href="assets/css/identity.css?v=1">
</head>

<body class="login-page">

    <main class="login-container">
        <section class="login-box">

            <header class="login-header">
                <img class="login-logo" src="assets/img/logo-autoflow.jpg" alt="AutoFlow Mecânica">
                <h1 class="sr-only">AutoFlow Mecânica</h1>
                <p>Gerenciamento automotivo</p>
            </header>

            <form id="login-form">
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        data-target="senha"
                    >
                        Mostrar senha
                    </button>
                </div>

                <button type="submit" class="login-submit">Entrar</button>
                <p id="login-message" class="form-message" aria-live="polite"></p>

                <div class="login-divider" aria-hidden="true">
                    <span>ou</span>
                </div>

                <button id="btn-google" class="google-login-button" type="button">
                    <span class="google-icon" aria-hidden="true">G</span>
                    <span>Entrar com o Google</span>
                </button>
            </form>

            <p class="register-link">
                Não possui uma conta?
                <a href="cadastro.html">Cadastre-se</a>
            </p>

        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/integration.js?v=9"></script>
    <script src="assets/js/script.js?v=9"></script>
</body>
</html>
